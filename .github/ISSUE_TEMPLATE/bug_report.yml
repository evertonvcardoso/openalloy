name: Bug report
description: Something does not work as described.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a problem. The diagnostics below make it
        possible to find the cause without access to your computer.
        Security problems: please use **Report a vulnerability** instead (see SECURITY.md).
  - type: input
    id: version
    attributes:
      label: OpenAlloy version
      description: Output of `openalloy --version`.
      placeholder: OpenAlloy 1.6.1
    validations:
      required: true
  - type: dropdown
    id: keyboard
    attributes:
      label: Keyboard
      options:
        - HyperX Alloy Origins Core (HyperX/Kingston, 0951:16e6)
        - HyperX Alloy Origins Core (HP, 03f0:098f)
        - Another model
        - No keyboard (--simulate)
    validations:
      required: true
  - type: input
    id: distro
    attributes:
      label: Distribution and desktop
      placeholder: e.g. SparkyLinux 8 (Debian testing), Xfce, Wayland/X11
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. openalloy apply wave
        2. ...
  - type: textarea
    id: doctor
    attributes:
      label: Output of `openalloy doctor` and `openalloy status`
      description: Sends nothing to the keyboard. Remove anything you consider private.
      render: text
    validations:
      required: true
  - type: textarea
    id: journal
    attributes:
      label: Service log
      description: Output of `journalctl --user -u openalloy -b --no-pager | tail -n 100`.
      render: text
