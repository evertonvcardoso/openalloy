name: Feature request
description: Suggest a new effect, option or improvement.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: Describe the need, not only the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: How could it work?
  - type: input
    id: keyboard
    attributes:
      label: Keyboard and firmware
      description: From `openalloy status`, if the request depends on the hardware.
